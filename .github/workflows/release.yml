# Crea la release de GitHub cuando llega una etiqueta vX.Y.Z con su carpeta versiones/vX.Y.Z/.
# La pantalla descarga releases/latest/download/manifiesto.txt y despues el .bin de la release.
# Plantilla en el repositorio del firmware: firmware/Makera_Z1_Display/tools/plantilla_releases/.
name: Publicar release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la carpeta de la version
        run: |
          dir="versiones/${GITHUB_REF_NAME}"
          test -f "$dir/Makera_Z1_Display.bin" || { echo "Falta $dir/Makera_Z1_Display.bin"; exit 1; }
          test -f "$dir/manifiesto.txt" || { echo "Falta $dir/manifiesto.txt"; exit 1; }
          grep -qx "version=${GITHUB_REF_NAME#v}" "$dir/manifiesto.txt" || { echo "El manifiesto no es de ${GITHUB_REF_NAME}"; exit 1; }

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="versiones/${GITHUB_REF_NAME}"
          notas="$dir/notas.md"
          [ -f "$notas" ] || { echo "Makera Z1 Display ${GITHUB_REF_NAME#v}" > /tmp/notas.md; notas=/tmp/notas.md; }
          gh release create "$GITHUB_REF_NAME" "$dir/Makera_Z1_Display.bin" "$dir/manifiesto.txt" \
            --title "Makera Z1 Display ${GITHUB_REF_NAME#v}" --notes-file "$notas" --latest
